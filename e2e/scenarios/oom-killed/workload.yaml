# The broken workload. {{.Name}} and {{.Namespace}} are filled in per run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Name}}
  namespace: {{.Namespace}}
  labels:
    app: {{.Name}}
    shipmind.dev/scenario: oom-killed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{.Name}}
  template:
    metadata:
      labels:
        app: {{.Name}}
    spec:
      containers:
        - name: reports
          image: docker.io/library/python:3.13-alpine@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
          command: ["python", "-c"]
          args:
            - |
              import time
              print("reports worker starting; loading the daily index", flush=True)
              index = bytearray(200 * 1024 * 1024)
              print("index loaded", flush=True)
              time.sleep(3600)
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
