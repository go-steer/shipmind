# A Deployment crash-loops because its container is killed for running
# out of memory: the process allocates a 200 MiB index at startup and its
# memory limit is 64Mi. The agent must connect the OOMKilled exit to the
# limit and say which field to raise, not blame the code or the node.
#
# {{.Name}} is unique per run (lookout keys an incident's ax task on the
# workload, so a reused name would land in the previous run's session).
namespace: triage-lab
workload: workload.yaml
expect:
  # Regular expressions, case-insensitive; the final answer must match
  # every one. Positive matches can't tell an answer that blames the limit
  # from one that names it and blames the node; the scenario catches the
  # common miss (no limit at all) and the transcript is there for the rest.
  mentions:
    - "oom.?kill|out.of.memory"
    - "\\b64 ?(mi|mib|mb|m)\\b"
    - "memory.?limit|limits\\W+memory|limit\\w* (of|on|for) (the )?memory"
  # How it may get there (#89): checked against the session's tool calls
  # (names match with or without the MCP server's prefix) and its usage.
  # A healthy run reads the pod and its owner in two or three calls, in
  # about four model calls; the bounds catch a runaway, not a slow day.
  trajectory:
    must_call:
      - get_k8s_resource|describe_k8s_resource
    never_call:
      - patch_k8s_resource
      - apply_k8s_manifest
      - delete_k8s_resource
      - create_cluster
      - update_cluster
      - create_node_pool
      - update_node_pool
      - cancel_operation
    max_tool_calls: 10
    max_model_calls: 10
  # The ground truth a judge model grades the answer against (#90),
  # alongside the mentions above: reported in the result, not gated.
  diagnosis: |
    Deployment {{.Name}} in namespace {{.Namespace}} is crash-looping: its
    reports container is killed with reason OOMKilled (exit code 137) during
    startup, right after logging "loading the daily index", which allocates
    about 200 MiB. The container's memory limit is 64Mi (request 32Mi), so the
    kernel kills it every time it starts.
    Root cause: the memory limit is far below what the workload needs at
    startup, not a node memory shortage, a code bug or an image problem.
    Fix: raise resources.limits.memory on the reports container to above the
    index's size (for example 256Mi, raising the request to match), or make
    the process load less; then let the Deployment roll out.
limits:
  # Break to incident, incident to answer, workload removed to suspend.
  incident: 10m
  diagnose: 15m
  suspend: 25m
