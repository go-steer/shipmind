# A Deployment crash-loops because its container is killed for running
# out of memory: the process allocates a 200 MiB index at startup and its
# memory limit is 64Mi. The agent must connect the OOMKilled exit to the
# limit and say which field to raise, not blame the code or the node.
#
# {{.Name}} is unique per run (lookout keys an incident's ax task on the
# workload, so a reused name would land in the previous run's session).
namespace: triage-lab
workload: workload.yaml
expect:
  # Regular expressions, case-insensitive; the final answer must match
  # every one.
  mentions:
    - "oom.?kill|out of memory"
    - "64 ?mi"
    - "memory limit|limits\\.memory|limits:\\s*memory"
limits:
  # Break to incident, incident to answer, workload removed to suspend.
  incident: 10m
  diagnose: 15m
  suspend: 25m
