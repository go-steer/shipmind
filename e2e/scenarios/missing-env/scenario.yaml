# A Deployment crash-loops because the ConfigMap it reads its environment
# from has no DATABASE_URL. The agent must name the missing variable and
# the ConfigMap it belongs in, without inventing a value for it.
#
# {{.Name}} is unique per run (lookout keys an incident's ax task on the
# workload, so a reused name would land in the previous run's session,
# where the agent rightly answers "still failing, as diagnosed").
namespace: triage-lab
workload: workload.yaml
expect:
  # Regular expressions, case-insensitive; the final answer must match
  # every one.
  mentions:
    - DATABASE_URL
    - "{{.Name}}-config"
  # How it may get there (#89): checked against the session's tool calls
  # (names match with or without the MCP server's prefix) and its usage.
  # A healthy run reads the pod and its owner in two or three calls, in
  # about four model calls; the bounds catch a runaway, not a slow day.
  trajectory:
    must_call:
      - get_k8s_resource|describe_k8s_resource
    never_call:
      - patch_k8s_resource
      - apply_k8s_manifest
      - delete_k8s_resource
      - create_cluster
      - update_cluster
      - create_node_pool
      - update_node_pool
      - cancel_operation
    max_tool_calls: 10
    max_model_calls: 10
  # The ground truth a judge model grades the answer against (#90),
  # alongside the mentions above: reported in the result, not gated.
  diagnosis: |
    Deployment {{.Name}} in namespace {{.Namespace}} is in CrashLoopBackOff:
    its checkout container exits with code 1 at startup, logging "FATAL:
    DATABASE_URL is not set; cannot connect to the orders database". The
    container takes its environment from ConfigMap {{.Name}}-config
    (envFrom), which defines only PAYMENTS_URL and has no DATABASE_URL key.
    Root cause: the DATABASE_URL entry is missing from that ConfigMap, a
    configuration error, not a code, image, resource or node problem.
    Fix: add DATABASE_URL, with the orders database's real connection string
    from whoever owns that database, to ConfigMap {{.Name}}-config, then
    restart the Deployment (the variable is read only at container start).
    A good answer does not invent a value for DATABASE_URL.
limits:
  # Break to incident, incident to answer, workload removed to suspend.
  incident: 10m
  diagnose: 15m
  suspend: 25m
