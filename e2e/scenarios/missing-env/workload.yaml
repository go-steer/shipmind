# The broken workload. {{.Name}} and {{.Namespace}} are filled in per run.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{.Name}}-config
  namespace: {{.Namespace}}
  labels:
    shipmind.dev/scenario: missing-env
data:
  PAYMENTS_URL: "http://payments.{{.Namespace}}.svc:8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Name}}
  namespace: {{.Namespace}}
  labels:
    app: {{.Name}}
    shipmind.dev/scenario: missing-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{.Name}}
  template:
    metadata:
      labels:
        app: {{.Name}}
    spec:
      containers:
        - name: checkout
          image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          envFrom:
            - configMapRef:
                name: {{.Name}}-config
          command:
            - sh
            - -c
            - |
              echo "checkout starting"
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: DATABASE_URL is not set; cannot connect to the orders database" >&2
                exit 1
              fi
              sleep 3600
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
