# Overflow-hint scenario (#131): a crash-looping Deployment whose enrichment
# bundle fits spec/delta/radius under lookout's 4096-byte --enrich-cap while
# overflowing section=logs into an `overflow section=logs cmd="lookout triage
# logs ..."` trailer. The missing SETTLEMENT_WEBHOOK_URL variable appears only
# in container logs, so the agent can only diagnose the root cause by following
# the overflow trailer with lookout_k8s_triage_logs.
#
# {{.Name}} is unique per run (lookout keys an incident's ax task on the
# workload, so a reused name would land in the previous run's session).
namespace: triage-lab
workload: workload.yaml
expect:
  mentions:
    - SETTLEMENT_WEBHOOK_URL
    - "{{.Name}}-config"
  trajectory:
    must_call:
      - k8s_triage_logs
    never_call:
      - patch_k8s_resource
      - apply_k8s_manifest
      - delete_k8s_resource
      - create_cluster
      - update_cluster
      - create_node_pool
      - update_node_pool
      - cancel_operation
    max_tool_calls: 10
    max_model_calls: 10
  diagnosis: |
    Deployment {{.Name}} in namespace {{.Namespace}} is in CrashLoopBackOff:
    its settlement container exits with code 1 at startup after nine boot
    stages, logging "FATAL: SETTLEMENT_WEBHOOK_URL is not set in ConfigMap
    {{.Name}}-config; cannot dispatch settlement confirmations". The container
    loads its environment from ConfigMap {{.Name}}-config (envFrom), which
    defines LEDGER_MODE, PAYMENTS_ENDPOINT, and RECONCILIATION_WINDOW but has
    no SETTLEMENT_WEBHOOK_URL key. Because the enrichment bundle hits its size
    cap before the logs section, the initial inject omits logs and carries an
    overflow trailer pointing to lookout triage logs; the agent must follow
    that overflow hint with lookout_k8s_triage_logs to find the missing
    variable.
    Root cause: SETTLEMENT_WEBHOOK_URL is missing from ConfigMap
    {{.Name}}-config, a configuration error, not a code, image, resource or
    node problem.
    Fix: add SETTLEMENT_WEBHOOK_URL with the real settlement confirmation
    webhook URL from the service owner to ConfigMap {{.Name}}-config, then
    restart Deployment {{.Name}} so the container picks up the updated
    environment. A good answer does not invent a URL value.
limits:
  incident: 10m
  diagnose: 15m
  suspend: 25m
