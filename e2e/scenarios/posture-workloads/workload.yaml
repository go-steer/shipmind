# Seeded posture fixture (#127 §4): healthy running pods with deliberate
# workload resilience and hardening omissions (no PDB, no probes, no
# resource limits, no container securityContext).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Name}}
  namespace: {{.Namespace}}
  labels:
    app: {{.Name}}
    shipmind.dev/scenario: posture-workloads
spec:
  replicas: 2
  selector:
    matchLabels:
      app: {{.Name}}
  template:
    metadata:
      labels:
        app: {{.Name}}
    spec:
      containers:
        - name: api
          image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command:
            - sh
            - -c
            - sleep 3600
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
