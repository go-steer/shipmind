# Seeded placement-posture fixture (#127 §4): 4 healthy replicas with no
# topologySpreadConstraints on topology.kubernetes.io/zone and a preferred
# self-podAffinity on kubernetes.io/hostname that packs all 4 pods onto a
# single node/zone. Because the affinity is preferred (not required) on
# hostname, leeway retains the assumed zone-spread default and scores live
# zone drift ([4,0] or [4,0,0]: relocation=2 >= 2, drift=0.50 > 0.30) on
# any multi-zone cluster, emitting a manifest_patch remediation adding
# topologySpreadConstraints on topology.kubernetes.io/zone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Name}}
  namespace: {{.Namespace}}
  labels:
    app: {{.Name}}
    shipmind.dev/scenario: posture-placement
spec:
  replicas: 4
  selector:
    matchLabels:
      app: {{.Name}}
  template:
    metadata:
      labels:
        app: {{.Name}}
    spec:
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{.Name}}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: worker
          image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command:
            - sh
            - -c
            - sleep 3600
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
