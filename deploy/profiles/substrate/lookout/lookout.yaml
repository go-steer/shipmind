# k8s-lookout with the ax sink: every incident it opens becomes an ax
# task, a copy of the task template in Secret lookout-ax-agent, which
# also holds the agent's tokens and so is never rendered from this
# repository (see kustomization.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: lookout-ax
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lookout-ax
  namespace: lookout-ax
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lookout-ax-watch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lookout-ax-watch
subjects:
  - kind: ServiceAccount
    name: lookout-ax
    namespace: lookout-ax
---
# Incident state survives a restart: without it lookout re-opens every
# open incident as new work after each rollout.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lookout-store
  namespace: lookout-ax
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lookout-ax
  namespace: lookout-ax
  labels:
    app: lookout-ax
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lookout-ax
  template:
    metadata:
      labels:
        app: lookout-ax
    spec:
      serviceAccountName: lookout-ax
      securityContext:
        fsGroup: 65532
      containers:
        - name: lookout
          image: ghcr.io/go-steer/lookout:v0.43.0-gke@sha256:71c1332f48311012e4194ebebca5a34b6c51f32160562a29d794a2a51207fe5e
          args:
            - --in-cluster
            # An environment overlay replaces these two (args 1 and 2).
            - --cluster-name=CLUSTER
            - --namespace=NAMESPACES
            - --dedup-window=5m
            - --storm=off
            - --store=/var/lib/lookout/lookout.db
            - --sink=ax
            - --ax-server=ax-server.ax-system.svc.cluster.local:8080
            - --ax-task-template=/etc/lookout-ax/task.yaml
            - --token-env=AGENT_TOKEN
            - --log-level=debug
          env:
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lookout-ax-agent
                  key: token
          volumeMounts:
            - name: store
              mountPath: /var/lib/lookout
            - name: agent
              mountPath: /etc/lookout-ax
              readOnly: true
            # Substrate's router takes only mTLS clients: lookout presents
            # this pod's podidentity certificate (its SPIFFE ID,
            # spiffe://cluster.local/ns/lookout-ax/sa/lookout-ax, must be
            # in the router's allowed list) and verifies the router
            # against the servicedns trust bundle. lookout's
            # --ax-router-* flags default to these paths, and it refuses
            # to start without the files.
            - name: podidentity
              mountPath: /run/podidentity.podcert.ate.dev
              readOnly: true
            - name: servicedns-ca
              mountPath: /run/servicedns-ca
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: lookout-store
        - name: agent
          secret:
            secretName: lookout-ax-agent
            items:
              - key: task.yaml
                path: task.yaml
        - name: podidentity
          projected:
            sources:
              - podCertificate:
                  signerName: podidentity.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
        - name: servicedns-ca
          projected:
            sources:
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
