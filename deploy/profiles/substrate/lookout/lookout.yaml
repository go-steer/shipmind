# k8s-lookout with the ax sink: every incident it opens becomes an ax
# task from task.yaml, and each cluster's watchboard runs from
# watchboard-task.yaml (#133). Both templates live in Secret
# lookout-ax-agent alongside the agent's attach token and so are never
# rendered from this repository (see kustomization.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: lookout-ax
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lookout-ax
  namespace: lookout-ax
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lookout-ax-watch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lookout-ax-watch
subjects:
  - kind: ServiceAccount
    name: lookout-ax
    namespace: lookout-ax
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lookout-ax-watch-capacity
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lookout-ax-watch-capacity
subjects:
  - kind: ServiceAccount
    name: lookout-ax
    namespace: lookout-ax
---
# Incident state survives a restart: without it lookout re-opens every
# open incident as new work after each rollout.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lookout-store
  namespace: lookout-ax
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lookout-ax
  namespace: lookout-ax
  labels:
    app: lookout-ax
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lookout-ax
  template:
    metadata:
      labels:
        app: lookout-ax
    spec:
      serviceAccountName: lookout-ax
      securityContext:
        fsGroup: 65532
      containers:
        - name: lookout
          image: ghcr.io/go-steer/lookout:v0.46.0-gke@sha256:d16db0ce086adfdff82d7a99879c9c2965f04cb5c921ac7e3d1990116a9c6d9c
          args:
            - --in-cluster
            # An environment overlay replaces these two (args 1 and 2).
            - --cluster-name=CLUSTER
            - --namespace=NAMESPACES
            - --dedup-window=5m
            # Enables storm correlation to protect the worker pool and
            # activates the live topology graph for enrichment and store
            # history (#132). Probes pods/nodes/replicasets list+watch
            # against ClusterRole lookout-ax-watch at startup.
            - --storm=auto
            - --store=/var/lib/lookout/lookout.db
            - --sink=ax
            - --ax-server=ax-server.ax-system.svc.cluster.local:8080
            - --ax-task-template=/etc/lookout-ax/task.yaml
            - --ax-watchboard-task-template=/etc/lookout-ax/watchboard-task.yaml
            - --token-env=AGENT_TOKEN
            - --log-level=debug
            # Reactive sources only: topology-drift and compute-class are
            # scheduled leeway report posture (#127), not streaming watch
            # sources. Keep at the end so args 1 and 2 stay at their indices.
            - --sources=k8s-events,object-state,rollout,workload,autoscaling,saturation,degradation,expiry,capacity,ingress,gateway
          env:
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lookout-ax-agent
                  key: token
          volumeMounts:
            - name: store
              mountPath: /var/lib/lookout
            - name: agent
              mountPath: /etc/lookout-ax
              readOnly: true
            # Substrate's router takes only mTLS clients: lookout presents
            # this pod's podidentity certificate (its SPIFFE ID,
            # spiffe://cluster.local/ns/lookout-ax/sa/lookout-ax, must be
            # in the router's allowed list) and verifies the router
            # against the servicedns trust bundle. lookout's
            # --ax-router-* flags default to these paths, and it refuses
            # to start without the files.
            - name: podidentity
              mountPath: /run/podidentity.podcert.ate.dev
              readOnly: true
            - name: servicedns-ca
              mountPath: /run/servicedns-ca
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: lookout-store
        - name: agent
          secret:
            secretName: lookout-ax-agent
            items:
              - key: task.yaml
                path: task.yaml
              - key: watchboard-task.yaml
                path: watchboard-task.yaml
        - name: podidentity
          projected:
            sources:
              - podCertificate:
                  signerName: podidentity.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
        - name: servicedns-ca
          projected:
            sources:
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
