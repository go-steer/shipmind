# k8s-lookout, opening an ax task per incident. Its RBAC is lookout's own
# watcher ClusterRole at the pinned version, renamed for this deployment.
#
# Not rendered here: Secret lookout-ax-agent (the agent's attach token
# and the ax task template, which carries the agent's tokens as plain
# env because ax has no secret references for env). `shipmind up`
# renders it from agents/sre-triage and the cluster's existing tokens.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../vendor/k8s-lookout/deploy/12-clusterrole-watcher
  - lookout.yaml
patches:
  - target:
      kind: ClusterRole
      name: lookout-watch
    patch: |-
      - op: replace
        path: /metadata/name
        value: lookout-ax-watch
      - op: replace
        path: /metadata/labels/app.kubernetes.io~1name
        value: lookout-ax-watch
