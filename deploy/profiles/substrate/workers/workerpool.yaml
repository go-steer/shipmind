# The Substrate workers ax tasks run on: a WorkerPool of gVisor sandbox
# hosts. Its pods select nodes of a ComputeClass named substrate-workers,
# which the environment provides: it must label its nodes
# ate.dev/worker-node=true (`shipmind up` patches Substrate's atelet to
# run only there) and taint them
# ate.dev/sandboxClass=gvisor:NoSchedule. The class may mix CPU
# generations: since v1.0, Substrate restores a memory snapshot only on a
# worker with the snapshot's CPU features, and otherwise falls back to
# restoring files only.
apiVersion: v1
kind: Namespace
metadata:
  name: ax-workers
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: ax-pool
  namespace: ax-workers
  labels:
    ate.dev/pool: ax-pool
spec:
  replicas: 4
  sandboxClasses:
    - name: gvisor
  # Substrate's gVisor worker at the pinned version, from upstream's
  # registry. Changing it rolls every worker.
  workerImage: ghcr.io/agent-substrate/substrate/ateworker-gvisor:v1.0.0-rc.1@sha256:02a31963cdfb1d250d205a55fb870385b1ba5bad1be1308d556a6296f76bf145
  template:
    nodeSelector:
      cloud.google.com/compute-class: substrate-workers
    # Since v1.0, Substrate books every agent's limits against its
    # worker's limits (less 64Mi the worker keeps), so the limits here
    # decide how many agents run at once: an agent asks for 500m and
    # 1Gi (agents/sre-triage/ax/task.yaml.tmpl), so three per worker,
    # twelve across the pool. Requests are one agent's worth: an idle
    # agent uses far less than its limit, and suspended agents book
    # nothing.
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
