# substrate-scope, the 3D view of every agent on Substrate, from its own
# manifests at the version versions.yaml pins. Its manifest names the
# image in the registry scope's CI pushes to; that is replaced with the
# image shipmind publishes from the same commit. The manifest also passes
# --cluster=agent-substrate, scope's own demo cluster: an overlay for
# another cluster patches it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../vendor/substrate-scope/deploy/namespace
  - ../../../vendor/substrate-scope/deploy/substrate-scope
patches:
  - target:
      kind: Deployment
      name: substrate-scope
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: substrate-scope
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/go-steer/shipmind/substrate-scope:c2e8f508caade95cfec42e4d54966ade5e7f222f@sha256:1f8c599a49b9806af7944773f9c10ce5dd76fac3e396e2c710fde18913d6825e
