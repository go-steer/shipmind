# substrate-scope, the 3D view of every agent on Substrate, from its own
# manifests at the version versions.yaml pins. Its manifest names the
# image in the registry scope's CI pushes to; that is replaced with a
# placeholder an environment overlay must set. The manifest also passes
# --cluster=agent-substrate, scope's own demo cluster: an overlay for
# another cluster patches it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../vendor/substrate-scope/deploy/namespace
  - ../../../vendor/substrate-scope/deploy/substrate-scope
patches:
  - target:
      kind: Deployment
      name: substrate-scope
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: substrate-scope
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ko://github.com/go-steer/substrate-scope
