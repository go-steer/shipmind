# The token refresher: agents never hold a Google credential. This
# Deployment's service account is a Workload Identity principal
# (setup/workload-identity.sh grants it); every 30 minutes it writes a
# fresh access token to Secret ate-credentials/google-token, and
# Substrate's egress gateway injects that token into agents' calls to
# Vertex and the GKE MCP server, per each task's egress rules.
apiVersion: v1
kind: Namespace
metadata:
  name: ate-credentials
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: token-refresher
  namespace: ate-credentials
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: token-refresher
  namespace: ate-credentials
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["google-token"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: token-refresher
  namespace: ate-credentials
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: token-refresher
subjects:
  - kind: ServiceAccount
    name: token-refresher
    namespace: ate-credentials
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-refresher
  namespace: ate-credentials
spec:
  replicas: 1
  selector:
    matchLabels:
      app: token-refresher
  template:
    metadata:
      labels:
        app: token-refresher
    spec:
      serviceAccountName: token-refresher
      containers:
        - name: refresher
          # Built from images/token-refresher (versions.yaml pins it).
          image: ghcr.io/go-steer/shipmind/token-refresher:6193d32b7b43b23c9dbb6f396632b832c15d51ee@sha256:9a61d5d5306a6c1bf83ed81b9abe975aec637ee94013b0ee6fae222e26240017
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
