# ax-server and its Postgres, from the ax fork's manifests at the version
# versions.yaml pins, with ax-server's image as shipmind publishes it.
# Snapshot storage is Substrate's (--snapshot-location at install), not
# ax's, since Substrate v1.0.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../vendor/ax/deploy/ax-server
  - postgres
images:
  - name: postgres
    newName: docker.io/library/postgres
    newTag: 17-alpine
    digest: sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
patches:
  # JSON patches, not strategic merges: a merge moves a patched env entry
  # to the front, and a reordered env is a change that restarts
  # ax-server. Each test op fails the build if the fork's manifest moves,
  # instead of patching the wrong thing.
  - target:
      kind: Deployment
      name: ax-server
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: ax-server
      # Upstream leaves the image to `make deploy` (${AX_SERVER_IMAGE}).
      - op: test
        path: /spec/template/spec/containers/0/image
        value: ${AX_SERVER_IMAGE}
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/go-steer/shipmind/ax-server:12dbe163b207888b743b10705d5ce26c8f5c2697@sha256:8e21fe2f61e964e7b2652cddd81ddb2bd29f91e44cd77723955f7704ab78102e
      # The image for tasks without spec.image, also left to `make
      # deploy`. Every task here sets its image, so ax-server's built-in
      # default stands.
      - op: test
        path: /spec/template/spec/containers/0/env/2/name
        value: AX_DEFAULT_TASK_IMAGE
      - op: remove
        path: /spec/template/spec/containers/0/env/2
      # The Substrate egress gateway runs with credential injection,
      # which intercepts TLS, so every task needs the gateway's CA. The
      # fork mounts it into each task's template when this is set.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AX_EGRESS_MITM_TRUST_BUNDLE
          value: "true"
