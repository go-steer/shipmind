# ax-server and its Redis, from the ax fork's manifests at the version
# versions.yaml pins, with ax-server's image as shipmind publishes it. An
# environment overlay sets the snapshot bucket (AX_SNAPSHOTS_BUCKET).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../vendor/ax/deploy/ax-server
  - redis
images:
  - name: ko://github.com/google/ax/cmd/ax-server
    newName: ghcr.io/go-steer/shipmind/ax-server
    newTag: 685b160d614122daea13d9fa56de1781a9d210f7
    digest: sha256:89f82c0106dfa1579eff1ff1537fad04b0a263faffca8b54227799acb023c000
  - name: redis
    newName: docker.io/library/redis
    newTag: 7-alpine
    digest: sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
patches:
  # The Substrate egress gateway runs with credential injection, which
  # intercepts TLS, so every task needs the gateway's CA. The fork mounts
  # it into each task's template when this is set.
  # A JSON patch, not a strategic merge: a merge moves the patched entry
  # to the front of env, and a reordered env is a change that restarts
  # ax-server. The test op fails the build if the fork's container order
  # changes, instead of patching the wrong container.
  - target:
      kind: Deployment
      name: ax-server
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: ax-server
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AX_EGRESS_MITM_TRUST_BUNDLE
          value: "true"
