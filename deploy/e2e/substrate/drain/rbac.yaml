# The nightly end-to-end scenario for the substrate profile. Not part of
# the profile itself: an environment opts in by referencing this
# directory, at the same shipmind commit as its profile, and setting the
# agents' atespace. The scenario's namespace (triage-lab) must exist: it
# is the cluster's lab namespace, which lookout watches.
# The worker-drain scenario's right (#105) to delete the worker pod hosting
# a task's actor, as a node drain does: pods in the workers' namespace only,
# found by IP and deleted with their default grace period.
#
# Opt-in: deleting a worker pod drains every actor on it, so an environment
# takes this only once its ax-server suspends a draining worker's actors
# (mastersingh24/ax#1). The runner also refuses to drain a worker that hosts
# another task in its atespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shipmind-e2e-drain
  namespace: ax-workers
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shipmind-e2e-drain
  namespace: ax-workers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shipmind-e2e-drain
subjects:
  - kind: ServiceAccount
    name: shipmind-e2e
    namespace: shipmind-e2e
