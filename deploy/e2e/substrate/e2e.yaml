# The nightly end-to-end scenario run against the substrate profile: a
# CronJob running `shipmind scenario run -in-cluster` from the e2e-runner
# image. It breaks a workload in the scenario's namespace (triage-lab),
# reads the agent's answer through Substrate's router, and deletes its
# workload and task afterwards. Its permissions are exactly that: manage
# Deployments and ConfigMaps in triage-lab, and read the agent's attach
# token. The ax CLI reaches ax-server over the network; ax has no
# per-caller authorization of its own.
apiVersion: v1
kind: Namespace
metadata:
  name: shipmind-e2e
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shipmind-e2e
  namespace: shipmind-e2e
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shipmind-e2e-workloads
  namespace: triage-lab
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shipmind-e2e-workloads
  namespace: triage-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shipmind-e2e-workloads
subjects:
  - kind: ServiceAccount
    name: shipmind-e2e
    namespace: shipmind-e2e
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shipmind-e2e-agent-token
  namespace: lookout-ax
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["lookout-ax-agent"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shipmind-e2e-agent-token
  namespace: lookout-ax
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shipmind-e2e-agent-token
subjects:
  - kind: ServiceAccount
    name: shipmind-e2e
    namespace: shipmind-e2e
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: missing-env
  namespace: shipmind-e2e
spec:
  # 03:17 UTC: off the hour, while the demo is quiet. An overlay may move it.
  schedule: "17 3 * * *"
  # Stated, so the field is managed: a hand-set suspend shows in
  # status and the next up undoes it (client-side apply leaves fields the
  # manifest never mentions alone, and kubectl diff merges the same way).
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 0
      # The scenario's limits add to 50 minutes (incident 10, diagnose 15,
      # suspend 25); with the sweep, the wake and up to 6 minutes of
      # cleanup, a worst case is about 57. 70 leaves room.
      activeDeadlineSeconds: 4200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: shipmind-e2e
        spec:
          serviceAccountName: shipmind-e2e
          restartPolicy: Never
          # On SIGTERM (the deadline, a drain) the runner cleans up: the
          # workload, then the task, each within 3 minutes. Let it finish.
          terminationGracePeriodSeconds: 390
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: run
              image: ghcr.io/go-steer/shipmind/e2e-runner:95cd6b8f259244777ea91facf5cc443aa097b6f5@sha256:0c7120fc586c204c130573e4ac896f48397057d8b9c7892b29eba0f61e6481e8
              args:
                - scenario
                - run
                - -in-cluster
                # The agents' atespace; an overlay replaces it (arg 3).
                - -atespace=ATESPACE
                - /scenarios/missing-env
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
