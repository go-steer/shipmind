# substrate-scope on one cluster: the collector polls Agent Substrate and ax
# and serves the UI on :8080. The namespace is in namespace.yaml.
#
# CI applies this file on every merge to main with the image digest it just
# built (see .github/workflows/ci.yml), so the digest below is only where a
# fresh cluster starts. `make deploy` applies it by hand with the digest of
# the latest main build, or IMAGE_REF.
#
# The attach proxy is off unless the Secret "substrate-scope-attach" exists
# (key "token": the bearer token agents expect on their session API):
#   kubectl -n substrate-scope create secret generic substrate-scope-attach --from-file=token=PATH

# Substrate v0.5.0 admits in-cluster API clients only from namespaces labeled
# ate.dev/api-access=true (namespace.yaml sets it; CI does not apply that file,
# so label an existing namespace by hand).
#
# With --experimental-enable-authz, v0.5.0 checks all five calls the collector
# makes. Then grant this account the global viewer role (member
# "user:system:serviceaccount:substrate-scope:substrate-scope"); see
# "Authorization" in docs/design.md. Without enforcement no grant is needed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: substrate-scope
  namespace: substrate-scope
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: substrate-scope
  namespace: substrate-scope
  labels:
    app.kubernetes.io/name: substrate-scope
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: substrate-scope
  template:
    metadata:
      labels:
        app.kubernetes.io/name: substrate-scope
    spec:
      serviceAccountName: substrate-scope
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: substrate-scope
          image: us-central1-docker.pkg.dev/gke-demos-345619/ax/substrate-scope@sha256:01baa882ade26836b236d20308a3fec9796faa771fca40b398cf919b3af70c97
          args:
            - "--addr=:8080"
            - "--cluster=agent-substrate"
            - "--substrate-endpoint=api.ate-system.svc.cluster.local:443"
            - "--substrate-authority=api.ate-system.svc"
            - "--substrate-token-file=/var/run/secrets/ateapi/token"
            - "--substrate-ca-file=/run/servicedns-ca/trust-bundle.pem"
            - "--ax-endpoint=ax-server.ax-system.svc.cluster.local:8080"
            # The router's HTTPS ingress, with this pod's podidentity
            # certificate. Its SPIFFE ID,
            # spiffe://cluster.local/ns/substrate-scope/sa/substrate-scope,
            # must be in ate-setup's ATE_INGRESS_ALLOWED_SPIFFE_IDS.
            - "--router=atenet-router.ate-system.svc.cluster.local:443"
            - "--router-cert-file=/run/podidentity/credential-bundle.pem"
            - "--router-ca-file=/run/servicedns-ca/trust-bundle.pem"
            - "--router-server-name=atenet-router.ate-system.svc"
            - "--attach-token-file=/run/attach/token"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - mountPath: /var/run/secrets/ateapi
              name: ate-token
              readOnly: true
            - mountPath: /run/servicedns-ca
              name: servicedns-ca
              readOnly: true
            - mountPath: /run/podidentity
              name: podidentity
              readOnly: true
            - mountPath: /run/attach
              name: attach-token
              readOnly: true
      volumes:
        # Same mechanism as ax-server: a projected token for the control
        # API's audience, and the servicedns CA bundle that signs its cert
        # (and the router's).
        - name: ate-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: api.ate-system.svc
                  expirationSeconds: 7200
                  path: token
        - name: servicedns-ca
          projected:
            sources:
              - clusterTrustBundle:
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
                  signerName: servicedns.podcert.ate.dev/identity
        # The client certificate for the router's mTLS ingress: Substrate's
        # podidentity signer issues an X.509-SVID for this pod's service
        # account, a PKCS#8 key then the chain in one file. It lasts up to
        # 24h and the kubelet rewrites it before expiry; the collector
        # re-reads it.
        - name: podidentity
          projected:
            sources:
              - podCertificate:
                  signerName: podidentity.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
        - name: attach-token
          secret:
            secretName: substrate-scope-attach
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: substrate-scope
  namespace: substrate-scope
  labels:
    app.kubernetes.io/name: substrate-scope
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: substrate-scope
