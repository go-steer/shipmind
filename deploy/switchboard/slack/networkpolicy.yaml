# Admit outbound-ingress POSTs (:8080) from Substrate's egress proxy in
# ate-system alone: ax incident tasks cannot dial cluster Services
# directly and reach switchboard only when their egress policy grants
# http://switchboard.switchboard.svc.cluster.local:8080.
- op: test
  path: /spec/ingress/0/ports/0/port
  value: metrics
- op: add
  path: /spec/ingress/-
  value:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ate-system
        podSelector:
          matchLabels:
            app: atenet-egress
    ports:
      - port: ingress
        protocol: TCP
