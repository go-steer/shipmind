# Admit outbound-ingress POSTs (:8080) from Substrate's egress proxy in
# ate-system (for ax incident tasks) and from the scheduled posture-audit
# CronJob pods in shipmind-audits (#127).
- op: test
  path: /spec/ingress/0/ports/0/port
  value: metrics
- op: add
  path: /spec/ingress/-
  value:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ate-system
        podSelector:
          matchLabels:
            app: atenet-egress
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: shipmind-audits
        podSelector:
          matchLabels:
            app.kubernetes.io/name: shipmind-audits
    ports:
      - port: ingress
        protocol: TCP
