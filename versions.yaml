# The platform's bill of materials: every component a shipmind release
# runs, pinned. `shipmind check` (and the verify-versions presubmit)
# enforces the rules: a version is a release tag (vX.Y.Z) or a full commit
# SHA, never a branch or an abbreviated SHA, and every image is pinned by
# digest.
#
# Every image the substrate profile runs is built by shipmind's CI from
# the pins below and published to ghcr.io/go-steer/shipmind, except the
# third-party ones (postgres, envoy, redis, lookout), pinned by digest as
# their projects publish them. switchboard, mast-web and core-agent join
# with the standalone profile and with switchboard starting ax agents.

components:
  - name: substrate
    source: github.com/agent-substrate/substrate
    version: v1.0.0-rc.1
    profiles: [substrate]
    images:
      - name: ateapi
        ref: ghcr.io/agent-substrate/substrate/ateapi:v1.0.0-rc.1@sha256:53afaaabe07c6caa71036dc880b514da9ca08973f4ba03586ccb4dbfe28931e3
      - name: atecontroller
        ref: ghcr.io/agent-substrate/substrate/atecontroller:v1.0.0-rc.1@sha256:b280e6ee6c9e4ebf01a18a271549c3294da3ced85f49b2deb88de4a8b035ea24
      - name: atelet
        ref: ghcr.io/agent-substrate/substrate/atelet:v1.0.0-rc.1@sha256:5c117b06276e709d023bf6c090b0a65f42d3f1bdeb2ffe99265d34c7ddbe453c
      - name: atenet
        ref: ghcr.io/agent-substrate/substrate/atenet:v1.0.0-rc.1@sha256:e2633da825fe45bcf32c23f96e7d434370a0fd6bdeb9eb50cd3f7ee3d8c311b8
      - name: ate-idp-server
        ref: ghcr.io/agent-substrate/substrate/ate-idp-server:v1.0.0-rc.1@sha256:e12ba06ad37b792daed6fdc0517b176174fb8814429ac8662cc02848f47732d1
      - name: objectstore-plugin
        ref: ghcr.io/agent-substrate/substrate/objectstore-plugin:v1.0.0-rc.1@sha256:d621b8cb79a75b908928d33a0646abb8eb5ab96504d1fa25108c9be5bf59c3cc
      - name: kubernetes-secrets
        ref: ghcr.io/agent-substrate/substrate/kubernetes-secrets:v1.0.0-rc.1@sha256:d0e376e7abfe4548316b8dc37e7f26b6da4763637ad7a3b33a6e8311ce23bcdd
      - name: podcertcontroller
        ref: ghcr.io/agent-substrate/substrate/podcertcontroller:v1.0.0-rc.1@sha256:8bcdeb6b5c63587dc60ec1d968233f143067d0eb4803b39dc78911b467a09e28
      - name: ateworker-gvisor
        ref: ghcr.io/agent-substrate/substrate/ateworker-gvisor:v1.0.0-rc.1@sha256:02a31963cdfb1d250d205a55fb870385b1ba5bad1be1308d556a6296f76bf145
      - name: envoy-dataplane
        ref: ghcr.io/agent-substrate/substrate/envoy-dataplane:v1.0.0-rc.1@sha256:c8dcfc127ec4381b31da9b9190b3231e2a98ccd207dd97a5c0b39bf25eeb20dd
      - name: postgres
        ref: docker.io/library/postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
      - name: envoy
        ref: docker.io/envoyproxy/envoy:v1.39.5@sha256:8fc594a5d85eb76dca24155cfb9208882406873932b20cf33649a0a611194c43
    note: >-
      Upstream Substrate v1.0.0-rc.1 (f86fde9), installed with its own
      ate-setup from the same tag, its images straight from upstream's
      registry by digest (ateworker-microvm is published too; the
      substrate profile runs gVisor only). postgres and envoy are the
      third-party images its manifests pin. No fork: the two settings
      the substrate profile still needs on top (atelet pinned to worker
      nodes, the router's parked-request budget) are patches `shipmind
      up` applies after the install, and `status` checks.

  - name: ax
    source: github.com/mastersingh24/ax
    version: 12dbe163b207888b743b10705d5ce26c8f5c2697
    profiles: [substrate]
    images:
      - name: ax-server
        ref: ghcr.io/go-steer/shipmind/ax-server:12dbe163b207888b743b10705d5ce26c8f5c2697@sha256:8e21fe2f61e964e7b2652cddd81ddb2bd29f91e44cd77723955f7704ab78102e
      - name: postgres
        ref: docker.io/library/postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    manifests:
      - deploy/ax-server.yaml
      - deploy/postgres.yaml
    note: >-
      ax-server, tag substrate-v1-12dbe16. Fork of google/ax: upstream
      main f0228f1 plus the fork's own task fields (egress, HTTP
      pass-through, idle suspend, on completion; proto numbers 100 and
      up), built against Substrate v1.0.0-rc.1. State in Postgres; its
      password is a Secret `shipmind up` generates. google/ax does not
      take PRs, so the fork is the source.

  - name: ax-runner
    source: github.com/mastersingh24/ax
    version: 12dbe163b207888b743b10705d5ce26c8f5c2697
    profiles: [substrate]
    note: >-
      The task runner baked into the agent image, at ax's commit. The v1
      port's runner reads one workspace (AX_WORKSPACE_YAML), so it rolls
      with ax-server: an older runner finds no workspace.

  - name: mast
    source: github.com/go-steer/mast
    version: 922e5491ba10562ddd68285e318c3efddf074d59
    profiles: [substrate]
    note: >-
      main after the ax upstreaming (#528-#531: injected Google auth,
      POST /sessions, --instructions, examples/deploy/ax). Built into the
      agent image; no release covers it yet.

  - name: agent-mast
    source: github.com/go-steer/shipmind
    version: bd1b6a78b303857993b0389c10fdbe85690f0736
    profiles: [substrate]
    images:
      - name: agent-mast
        ref: ghcr.io/go-steer/shipmind/agent-mast:bd1b6a78b303857993b0389c10fdbe85690f0736@sha256:4190739cb04320d3f9d37e6ab90af7399af2df291381e5dcb9b9b0d8ad495e6a
    note: >-
      The agent image, built by this repository (images/agent-mast) at the
      commit in version: the mast and ax-runner pins above plus
      agents/sre-triage's bundles (gke-triage-f for lookout's incidents,
      gke-chat for switchboard's threads). CI publishes a new build from
      every main commit that touches those inputs; move this pin to one
      deliberately.

  - name: k8s-lookout
    source: github.com/go-steer/k8s-lookout
    version: v0.43.0
    profiles: [substrate]
    images:
      - name: lookout
        ref: ghcr.io/go-steer/lookout:v0.43.0-gke@sha256:71c1332f48311012e4194ebebca5a34b6c51f32160562a29d794a2a51207fe5e
    manifests:
      - deploy/12-clusterrole-watcher.yaml
    note: >-
      Runs with the ax sink, opening one ax task per incident. Only the
      watcher ClusterRole is vendored; the substrate profile's deployment
      is shaped for the ax sink (deploy/profiles/substrate/lookout).
      v0.43.0 speaks the ax fork's v1 port (12dbe16) and reaches
      Substrate's router over mTLS; it rolls with ax-server.

  - name: substrate-scope
    source: github.com/go-steer/substrate-scope
    version: d52a8aab965cc5c4cf0d5e5e6e8e6480447e560a
    profiles: [substrate]
    images:
      - name: substrate-scope
        ref: ghcr.io/go-steer/shipmind/substrate-scope:d52a8aab965cc5c4cf0d5e5e6e8e6480447e560a@sha256:751ca05d32a86f6cd8a785d78ae39c2ef2a697752903a4f25f6bec177d60552e
    manifests:
      - deploy/namespace.yaml
      - deploy/substrate-scope.yaml

  - name: token-refresher
    source: github.com/go-steer/shipmind
    version: 6193d32b7b43b23c9dbb6f396632b832c15d51ee
    profiles: [substrate]
    images:
      - name: token-refresher
        ref: ghcr.io/go-steer/shipmind/token-refresher:6193d32b7b43b23c9dbb6f396632b832c15d51ee@sha256:9a61d5d5306a6c1bf83ed81b9abe975aec637ee94013b0ee6fae222e26240017
    note: >-
      Built by this repository (images/token-refresher) at the commit in
      version. CI publishes a build from every main commit that touches
      it; move this pin deliberately.

  - name: e2e-runner
    source: github.com/go-steer/shipmind
    version: be40f0d15a1318f1e59cceb796a699918d265aa4
    profiles: [substrate]
    images:
      - name: e2e-runner
        ref: ghcr.io/go-steer/shipmind/e2e-runner:be40f0d15a1318f1e59cceb796a699918d265aa4-ax-12dbe163b207@sha256:472b6bb5751bf94ea34c99107d3161228dfc7b901e388096cd21b02ed1613f1a
    note: >-
      The end-to-end runner (images/e2e-runner: shipmind, the ax CLI,
      kubectl, the scenarios) at the commit in version, which the nightly
      in deploy/e2e/substrate runs. CI publishes a build from every main
      commit that touches its inputs; move this pin deliberately. This
      build was dispatched with ax-commit 12dbe16 (its ax CLI), ahead of
      the pin moving (hence the -ax- tag); it has router mTLS (#50).

  - name: switchboard
    source: github.com/go-steer/switchboard
    version: v0.9.1
    profiles: [standalone, substrate]
    images:
      - name: switchboard
        ref: ghcr.io/go-steer/switchboard:0.9.1@sha256:985c50f0ac11d47adc0f35742ea6f7410b18b84da8e8583c784896f152bf09e9
    manifests:
      - deploy/base/11-serviceaccount.yaml
      - deploy/base/16-networkpolicy.yaml
      - deploy/base/51-deployment.yaml
      - deploy/components/durable-state/pvc.yaml
    files:
      - deploy/slack/app-manifest.yaml
    note: >-
      The chat gateway. v0.9.0 started agents as ax tasks; v0.9.1 stops
      asserting the chat user to them by default (mast's attach surface
      refuses X-Asserted-Caller; per-agent `assert_caller`, for core-agent
      later, shipmind#48). It starts agents as ax tasks (switchboard
      docs/ax-backend.md): one per Slack thread, reached through
      Substrate's router over mTLS. deploy/switchboard/slack runs its Slack
      gateway in front of the SRE triage agent; an environment opts in by
      referencing it. Vendored: the base and the durable-state PVC (the
      durable-state and ax-router-mtls patches are in that part, since a
      vendored base can't carry a component). Also the Slack app manifest,
      which `shipmind slack-app` renames per environment: its scopes follow
      the API calls this version makes, so a bump re-vendors them.