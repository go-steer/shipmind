# The platform's bill of materials: every component a shipmind release
# runs, pinned. `shipmind check` (and the verify-versions presubmit)
# enforces the rules: a version is a release tag (vX.Y.Z) or a full commit
# SHA, never a branch or an abbreviated SHA, and every image is pinned by
# digest.
#
# Every image the substrate profile runs is built by shipmind's CI from
# the pins below and published to ghcr.io/go-steer/shipmind, except the
# third-party ones (postgres, envoy, redis, lookout), pinned by digest as
# their projects publish them. switchboard, mast-web and core-agent join
# with the standalone profile and with switchboard starting ax agents.

components:
  - name: substrate
    source: github.com/mastersingh24/substrate
    version: b52296feb32525869befb16c7128ccafbb79cfe2
    profiles: [substrate]
    images:
      - name: ateapi
        ref: ghcr.io/go-steer/shipmind/substrate/ateapi:b52296feb32525869befb16c7128ccafbb79cfe2@sha256:15b927fd2820c20f7fa9e9c3ae0809453f998a8400f96cfbaeb24ce19838c25b
      - name: atecontroller
        ref: ghcr.io/go-steer/shipmind/substrate/atecontroller:b52296feb32525869befb16c7128ccafbb79cfe2@sha256:4e454471fa4e74ba270822d17fde24f5734068bf397a4dafd3b0a08cde4ad2d8
      - name: atelet
        ref: ghcr.io/go-steer/shipmind/substrate/atelet:b52296feb32525869befb16c7128ccafbb79cfe2@sha256:a98b9048cbf1852ac5551f33c6f49e5e474a1d939297a06f84c2b472e2fa6a7e
      - name: atenet
        ref: ghcr.io/go-steer/shipmind/substrate/atenet:b52296feb32525869befb16c7128ccafbb79cfe2@sha256:5c17428778ef8639f821fe8a45195d381e5e84f88b6b372060c5703b8d7ed1c6
      - name: objectstore-plugin
        ref: ghcr.io/go-steer/shipmind/substrate/objectstore-plugin:b52296feb32525869befb16c7128ccafbb79cfe2@sha256:8d54fb486662170e463ecd177b58192102a7892b4dbcbc0f14c47b7b51f63132
      - name: kubernetes-secrets
        ref: ghcr.io/go-steer/shipmind/substrate/kubernetes-secrets:b52296feb32525869befb16c7128ccafbb79cfe2@sha256:0e49cd4c08208776406fd96ad317f50dcba3b7fc167039f5e1a24ad2e99d2ff9
      - name: podcertcontroller
        ref: ghcr.io/go-steer/shipmind/substrate/podcertcontroller:b52296feb32525869befb16c7128ccafbb79cfe2@sha256:3bd0bcbaa2d8b9db6faa4f52bbfc6a0aa8f5d04f4d33cfe3efe178384f056c64
      - name: ateom-gvisor
        ref: ghcr.io/go-steer/shipmind/substrate/ateom-gvisor:b52296feb32525869befb16c7128ccafbb79cfe2@sha256:0aac2c562734d0bdaa6b786899a3c2afac156007c5494bb75b38d420d659c77d
      - name: envoy-dataplane
        ref: ghcr.io/go-steer/shipmind/substrate/envoy-dataplane:b52296feb32525869befb16c7128ccafbb79cfe2@sha256:739a356a4f1a17dc28686da85f729ea6a380d6f352ca7a46795f54cd996cdfda
      - name: postgres
        ref: docker.io/library/postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
      - name: envoy
        ref: docker.io/envoyproxy/envoy:v1.39.4@sha256:74bd4eb5629708d3fadca1a5e6b85d208f338d7bb54e06b69565905c5294cc01
    note: >-
      Upstream v0.5.0 plus the agent-substrate cluster patches on fork
      branch agent-substrate-cluster-v0.5.0 (node selectors, router parked
      request budget, atelet pinned to worker nodes, C4-first worker
      ComputeClass).

  - name: ax
    source: github.com/mastersingh24/ax
    version: 685b160d614122daea13d9fa56de1781a9d210f7
    profiles: [substrate]
    images:
      - name: ax-server
        ref: ghcr.io/go-steer/shipmind/ax-server:685b160d614122daea13d9fa56de1781a9d210f7@sha256:89f82c0106dfa1579eff1ff1537fad04b0a263faffca8b54227799acb023c000
      - name: redis
        ref: docker.io/library/redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    manifests:
      - deploy/ax-server.yaml
      - deploy/redis.yaml
    note: >-
      ax-server, deploy tag deployed/substrate-v0.5-685b160. Fork of
      google/ax: upstream main 8888435 plus the fork's patch stack
      (Substrate v0.5, task egress credentials, HTTP pass-through, idle
      suspend, Redis persistence). google/ax does not take PRs, so the
      fork is the source.

  - name: ax-runner
    source: github.com/mastersingh24/ax
    version: e8bc98d87d9e3dcdee4aafa899bc802186d67dcb
    profiles: [substrate]
    note: >-
      The task runner baked into the agent image. ax-server moved on to
      685b160 without changing the runner, so the agent image was not
      rebuilt.

  - name: mast
    source: github.com/go-steer/mast
    version: 922e5491ba10562ddd68285e318c3efddf074d59
    profiles: [substrate]
    note: >-
      main after the ax upstreaming (#528-#531: injected Google auth,
      POST /sessions, --instructions, examples/deploy/ax). Built into the
      agent image; no release covers it yet.

  - name: agent-mast
    source: github.com/go-steer/shipmind
    version: aa9729e195a18f3074f80d1c6957cc4d5d0de55c
    profiles: [substrate]
    images:
      - name: agent-mast
        ref: ghcr.io/go-steer/shipmind/agent-mast:aa9729e195a18f3074f80d1c6957cc4d5d0de55c@sha256:82128f81c9f09b69360a7aed63649d291ccc97e9aa7f9e0e0bb79e6ad4ef9402
    note: >-
      The agent image, built by this repository (images/agent-mast) at the
      commit in version: the mast and ax-runner pins above plus
      agents/sre-triage. CI publishes a new build from every main commit
      that touches those inputs; move this pin to one deliberately.

  - name: k8s-lookout
    source: github.com/go-steer/k8s-lookout
    version: v0.36.0
    profiles: [substrate]
    images:
      - name: lookout
        ref: ghcr.io/go-steer/lookout:v0.36.0-gke@sha256:5b950c8fad9f5c2a61a532f99bf9a0b3da2a0c33cb0e52129f59cf93d9321cd8
    manifests:
      - deploy/12-clusterrole-watcher.yaml
    note: >-
      Runs with the ax sink, opening one ax task per incident. Only the
      watcher ClusterRole is vendored; the substrate profile's deployment
      is shaped for the ax sink (deploy/profiles/substrate/lookout).

  - name: substrate-scope
    source: github.com/go-steer/substrate-scope
    version: c2e8f508caade95cfec42e4d54966ade5e7f222f
    profiles: [substrate]
    images:
      - name: substrate-scope
        ref: ghcr.io/go-steer/shipmind/substrate-scope:c2e8f508caade95cfec42e4d54966ade5e7f222f@sha256:1f8c599a49b9806af7944773f9c10ce5dd76fac3e396e2c710fde18913d6825e
    manifests:
      - deploy/namespace.yaml
      - deploy/substrate-scope.yaml

  - name: token-refresher
    source: github.com/go-steer/shipmind
    version: 6193d32b7b43b23c9dbb6f396632b832c15d51ee
    profiles: [substrate]
    images:
      - name: token-refresher
        ref: ghcr.io/go-steer/shipmind/token-refresher:6193d32b7b43b23c9dbb6f396632b832c15d51ee@sha256:9a61d5d5306a6c1bf83ed81b9abe975aec637ee94013b0ee6fae222e26240017
    note: >-
      Built by this repository (images/token-refresher) at the commit in
      version. CI publishes a build from every main commit that touches
      it; move this pin deliberately.

  - name: e2e-runner
    source: github.com/go-steer/shipmind
    version: 95cd6b8f259244777ea91facf5cc443aa097b6f5
    profiles: [substrate]
    images:
      - name: e2e-runner
        ref: ghcr.io/go-steer/shipmind/e2e-runner:95cd6b8f259244777ea91facf5cc443aa097b6f5@sha256:0c7120fc586c204c130573e4ac896f48397057d8b9c7892b29eba0f61e6481e8
    note: >-
      The end-to-end runner (images/e2e-runner: shipmind, the ax CLI,
      kubectl, the scenarios) at the commit in version, which the nightly
      in deploy/e2e/substrate runs. CI publishes a build from every main
      commit that touches its inputs; move this pin deliberately.

  - name: switchboard
    source: github.com/go-steer/switchboard
    version: v0.8.0
    profiles: [standalone, substrate]
    images:
      - name: switchboard
        ref: ghcr.io/go-steer/switchboard:0.8.0@sha256:9d8eae9bf5a0c531d2374fc20a6cc8bf7d70133367e808dbc364e8b17828a6de
    manifests:
      - deploy/base/11-serviceaccount.yaml
      - deploy/base/16-networkpolicy.yaml
      - deploy/base/51-deployment.yaml
      - deploy/components/durable-state/pvc.yaml
    note: >-
      The chat gateway, run as two instances (Slack and Google Chat) from
      one base, as switchboard's own gke-demo does. Vendored: the base and
      the durable-state PVC; durable-state's mount is a kustomize patch,
      which a profile part carries. Not yet rendered by a profile: which
      agents the gateways front, and on which cluster, is still open.
