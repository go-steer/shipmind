# The platform's bill of materials: every component a shipmind release
# runs, pinned. `shipmind check` (and the verify-versions presubmit)
# enforces the rules: a version is a release tag (vX.Y.Z) or a full commit
# SHA, never a branch or an abbreviated SHA, and every image is pinned by
# digest.
#
# Every image the substrate profile runs is built by shipmind's CI from
# the pins below and published to ghcr.io/go-steer/shipmind, except the
# ones other projects publish (postgres, envoy, redis, lookout,
# switchboard), pinned by digest as they publish them. mast-web joins
# with the standalone profile.

components:
  - name: substrate
    source: github.com/agent-substrate/substrate
    version: v1.0.0
    profiles: [substrate]
    images:
      - name: ateapi
        ref: ghcr.io/agent-substrate/substrate/ateapi:v1.0.0@sha256:2f1ee444b126b6e3620045b61d2a87507fb0f889da0249656c474ab59dc2beaf
      - name: atecontroller
        ref: ghcr.io/agent-substrate/substrate/atecontroller:v1.0.0@sha256:44b3a127048e1da8c15dff35f65defe73f4e54ebb985bc020aa9bb0e6eb029b2
      - name: atelet
        ref: ghcr.io/agent-substrate/substrate/atelet:v1.0.0@sha256:79abc69f982392adbcbc3332cd8191cf74ac3cd1f4a43c44e9c8a3ce16488b6e
      - name: atenet
        ref: ghcr.io/agent-substrate/substrate/atenet:v1.0.0@sha256:04f7d93dc3fb3deda688137077226c12ce2da41cd4753adff708e3737dc59e20
      - name: ate-idp-server
        ref: ghcr.io/agent-substrate/substrate/ate-idp-server:v1.0.0@sha256:9553c0e60a8ad8bbb1c54c59e59cf0d33a338bf4f883b6f806610dc407f49f7c
      - name: objectstore-plugin
        ref: ghcr.io/agent-substrate/substrate/objectstore-plugin:v1.0.0@sha256:485cf92b31fed761c53f478d17ed69bf552a2cd8e8cf3b24b98a3e06789ee274
      - name: kubernetes-secrets
        ref: ghcr.io/agent-substrate/substrate/kubernetes-secrets:v1.0.0@sha256:21d494e2461d920bb03a66a0cdf574835c7d2e019b7941acef675ecff5702344
      - name: podcertcontroller
        ref: ghcr.io/agent-substrate/substrate/podcertcontroller:v1.0.0@sha256:1005579b2142f63412507342f095894eb435fe3736607f32dbad406d0e05c5a5
      - name: ateworker-gvisor
        ref: ghcr.io/agent-substrate/substrate/ateworker-gvisor:v1.0.0@sha256:f8987236c6256f58c4b2625e543b43f4ae4bdded6ee6821c03d966effb7c0f17
      - name: envoy-dataplane
        ref: ghcr.io/agent-substrate/substrate/envoy-dataplane:v1.0.0@sha256:fc8e4c3ee9060a01153e4d4af571f3db294e60d536422e8a8c2996fa4a72bf8b
      - name: postgres
        ref: docker.io/library/postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
      - name: envoy
        ref: docker.io/envoyproxy/envoy:v1.39.5@sha256:8fc594a5d85eb76dca24155cfb9208882406873932b20cf33649a0a611194c43
    note: >-
      Upstream Substrate v1.0.0 (b34fbee74), installed with its own
      ate-setup from the same tag, its images straight from upstream's
      registry by digest (ateworker-microvm is published too; the
      substrate profile runs gVisor only). postgres and envoy are the
      third-party images its manifests pin. No fork: the two settings
      the substrate profile still needs on top (atelet pinned to worker
      nodes, the router's parked-request budget) are patches `shipmind
      up` applies after the install, and `status` checks.

  - name: ax
    source: github.com/mastersingh24/ax
    version: 7c50347497bcb6b0179860a21000e4ce268aa236
    profiles: [substrate]
    images:
      - name: ax-server
        ref: ghcr.io/go-steer/shipmind/ax-server:7c50347497bcb6b0179860a21000e4ce268aa236@sha256:0d6680c87cdc1133a89624010214af094e6f678918f0521243e2ef79349ae567
      - name: postgres
        ref: docker.io/library/postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    manifests:
      - deploy/ax-server.yaml
      - deploy/postgres.yaml
    note: >-
      ax-server, tag substrate-v1-7c50347 (branch substrate-v1-r4). Fork of
      google/ax: upstream main 241bc4d with go.ate.dev/substrate v1.0.0,
      plus the fork's own task fields (egress, HTTP pass-through, idle
      suspend, on completion; proto numbers 100 and up, ax.proto unchanged
      since 12dbe16), a stable Ready updateTime (google/ax#539), and the
      runner's pass-through sending Host 127.0.0.1:<port> with the
      router's name in X-Forwarded-Host. State in Postgres; its password
      is a Secret `shipmind up` generates. google/ax does not take PRs, so
      the fork is the source.

  - name: ax-runner
    source: github.com/mastersingh24/ax
    version: 7c50347497bcb6b0179860a21000e4ce268aa236
    profiles: [substrate]
    note: >-
      The task runner baked into both agent images, at ax's commit. The v1
      port's runner reads one workspace (AX_WORKSPACE_YAML), so it rolls
      with ax-server: an older runner finds no workspace. At 7c50347 its
      pass-through sends the task Host 127.0.0.1:<port> (the router's name
      in X-Forwarded-Host), and the workspace's first-run marker lives on
      the workspace volume (upstream #551), so a cold resume doesn't redo
      setup over the agent's edits.

  - name: mast
    source: github.com/go-steer/mast
    version: 922e5491ba10562ddd68285e318c3efddf074d59
    profiles: [substrate]
    note: >-
      main after the ax upstreaming (#528-#531: injected Google auth,
      POST /sessions, --instructions, examples/deploy/ax). Built into the
      agent image; no release covers it yet.

  - name: core-agent
    source: github.com/go-steer/core-agent
    version: c2b516bbd3da35dae279aa9c16c63d1af526b008
    profiles: [substrate]
    note: >-
      v3.1.0, pinned by commit because images/agent builds it from
      source and checks what it fetched. The harness replacing mast (#48),
      built into images/agent with the ax-runner pin above; its own
      `config import-workload` converts agents/sre-triage's bundles at
      build time. 3.1's importer gives each specialist its own content
      root and the main agent no MCP servers (core-agent#1498), which
      images/agent checks; it enforces agent.max_steps (#1500). rc.1
      began refusing a request on its loopback attach listener
      whose Host isn't loopback (DNS-rebinding guard, core-agent#1358);
      requests arrive through Substrate's router and ax-task-runner's
      pass-through still naming the router, so both bundles' overlays
      list it in attach.allowed_hosts. v3.1.0-dev.3 was the first
      release where an ax task can serve sessions on its attach token
      alone and a proxy can assert callers the token's one-row table
      doesn't list (go-steer/core-agent#1483, #1485).

  - name: agent-mast
    source: github.com/go-steer/shipmind
    version: 57db3c533c28b77a9ad9c447c1b63ca4029d5761
    profiles: [substrate]
    images:
      - name: agent-mast
        ref: ghcr.io/go-steer/shipmind/agent-mast:57db3c533c28b77a9ad9c447c1b63ca4029d5761@sha256:a37c1199fb76c4be74faeac96c2180ed40f644745a1cd61711df4594aa044574
    note: >-
      The agent image, built by this repository (images/agent-mast) at the
      commit in version: the mast and ax-runner pins above plus
      agents/sre-triage's bundles (gke-triage-f for lookout's incidents,
      gke-chat for switchboard's threads). CI publishes a new build from
      every main commit that touches those inputs; move this pin to one
      deliberately.

  - name: agent
    source: github.com/go-steer/shipmind
    version: 2ef5d3b1b7d784adec7752a149cb17ff5cf40339
    profiles: [substrate]
    images:
      - name: agent
        ref: ghcr.io/go-steer/shipmind/agent:2ef5d3b1b7d784adec7752a149cb17ff5cf40339@sha256:e78f0a5903f9e388534806b78cd86958f7b33c0d45986a69610dc59d9297c7d9
    note: >-
      The agent image on core-agent (#48), built by this repository
      (images/agent) at the commit in version: the core-agent and
      ax-runner pins above plus agents/sre-triage's bundles, converted at
      build time. An environment's agent.chatImage runs switchboard's
      threads on it, and agent.incidentImage lookout's incidents. CI publishes
      a new build from every main commit that touches those inputs; move
      this pin to one deliberately.

  - name: k8s-lookout
    source: github.com/go-steer/k8s-lookout
    version: v0.43.1
    profiles: [substrate]
    images:
      - name: lookout
        ref: ghcr.io/go-steer/lookout:v0.43.1-gke@sha256:7ea96a4818f4914d3bead1759417a59c8405ab0e6b17d24f81c8aceb362b4f41
    manifests:
      - deploy/12-clusterrole-watcher.yaml
    note: >-
      Runs with the ax sink, opening one ax task per incident. Only the
      watcher ClusterRole is vendored; the substrate profile's deployment
      is shaped for the ax sink (deploy/profiles/substrate/lookout).
      v0.43 speaks the ax fork's v1 port (12dbe16) and reaches Substrate's
      router over mTLS; it rolls with ax-server. v0.43.1 stops re-opening
      a resolved incident when a relist re-delivers its unchanged Event
      (shipmind#60).

  - name: substrate-scope
    source: github.com/go-steer/substrate-scope
    version: d52a8aab965cc5c4cf0d5e5e6e8e6480447e560a
    profiles: [substrate]
    images:
      - name: substrate-scope
        ref: ghcr.io/go-steer/shipmind/substrate-scope:d52a8aab965cc5c4cf0d5e5e6e8e6480447e560a@sha256:751ca05d32a86f6cd8a785d78ae39c2ef2a697752903a4f25f6bec177d60552e
    manifests:
      - deploy/namespace.yaml
      - deploy/substrate-scope.yaml

  - name: token-refresher
    source: github.com/go-steer/shipmind
    version: 6193d32b7b43b23c9dbb6f396632b832c15d51ee
    profiles: [substrate]
    images:
      - name: token-refresher
        ref: ghcr.io/go-steer/shipmind/token-refresher:6193d32b7b43b23c9dbb6f396632b832c15d51ee@sha256:9a61d5d5306a6c1bf83ed81b9abe975aec637ee94013b0ee6fae222e26240017
    note: >-
      Built by this repository (images/token-refresher) at the commit in
      version. CI publishes a build from every main commit that touches
      it; move this pin deliberately.

  - name: e2e-runner
    source: github.com/go-steer/shipmind
    version: f4f07d9a95fc50efb5acb1d9e08790c8ef4087e7
    profiles: [substrate]
    images:
      - name: e2e-runner
        ref: ghcr.io/go-steer/shipmind/e2e-runner:f4f07d9a95fc50efb5acb1d9e08790c8ef4087e7@sha256:8feed51105d1b6163d8e53b246f28bcd80fb39f7c3a469c0ea8820d99c05cbdf
    note: >-
      The end-to-end runner (images/e2e-runner: shipmind, the ax CLI,
      kubectl, the scenarios) at the commit in version, which the nightly
      in deploy/e2e/substrate runs. CI publishes a build from every main
      commit that touches its inputs; move this pin deliberately. This
      build reads core-agent's sessions as well as mast's (#68) and
      records each answer's model usage (#73); it carries the
      oom-killed scenario (#79), can archive each run (#86), and checks
      each run's trajectory (#94).

  - name: switchboard
    source: github.com/go-steer/switchboard
    version: v0.9.2
    profiles: [standalone, substrate]
    images:
      - name: switchboard
        ref: ghcr.io/go-steer/switchboard:0.9.2@sha256:8b17b1a8d44452058b55fc0bcb85f541905c5b3b028f853916e16c52e1d5c7d9
    manifests:
      - deploy/base/11-serviceaccount.yaml
      - deploy/base/16-networkpolicy.yaml
      - deploy/base/51-deployment.yaml
      - deploy/components/durable-state/pvc.yaml
    files:
      - deploy/slack/app-manifest.yaml
    note: >-
      The chat gateway. v0.9.0 started agents as ax tasks; v0.9.1 stopped
      asserting the chat user to them by default, and v0.9.2 to mast
      daemons too (mast's attach surface
      refuses X-Asserted-Caller; per-agent `assert_caller`, for core-agent
      later, shipmind#48). It starts agents as ax tasks (switchboard
      docs/ax-backend.md): one per Slack thread, reached through
      Substrate's router over mTLS. deploy/switchboard/slack runs its Slack
      gateway in front of the SRE triage agent; an environment opts in by
      referencing it. Vendored: the base and the durable-state PVC (the
      durable-state and ax-router-mtls patches are in that part, since a
      vendored base can't carry a component). Also the Slack app manifest,
      which `shipmind slack-app` renames per environment: its scopes follow
      the API calls this version makes, so a bump re-vendors them.