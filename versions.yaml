# The platform's bill of materials: every component a shipmind release
# runs, pinned. `shipmind check` (and the verify-versions presubmit)
# enforces the rules: a version is a release tag (vX.Y.Z) or a full commit
# SHA, never a branch or an abbreviated SHA, and every image is pinned by
# digest.
#
# Every image the substrate profile runs is built by shipmind's CI from
# the pins below and published to ghcr.io/go-steer/shipmind, except the
# ones other projects publish (postgres, envoy, redis, lookout,
# switchboard), pinned by digest as they publish them. mast-web joins
# with the standalone profile.

components:
  - name: substrate
    source: github.com/agent-substrate/substrate
    version: v1.0.1
    profiles: [substrate]
    images:
      - name: ateapi
        ref: ghcr.io/agent-substrate/substrate/ateapi:v1.0.1@sha256:5d9f6da2e1446766a48908764891cc3c66cc6ff657279415c0d3839d5e9476ee
      - name: atecontroller
        ref: ghcr.io/agent-substrate/substrate/atecontroller:v1.0.1@sha256:b63519a821f4c702a689caf5b1ff549a8d6134ac3da94def30c71f914a70d614
      - name: atelet
        ref: ghcr.io/agent-substrate/substrate/atelet:v1.0.1@sha256:f6707957b470d8a8529e65a4ec3eb1ad5182a607b313b6b1628c7fe6c0e5a9e6
      - name: atenet
        ref: ghcr.io/agent-substrate/substrate/atenet:v1.0.1@sha256:ccfa3265be2f45d5ffa7d86ffbe32fa0976426eb1fe1bb28dffbce451c1ea5d7
      - name: ate-idp-server
        ref: ghcr.io/agent-substrate/substrate/ate-idp-server:v1.0.1@sha256:5d9302255998a3f376cbea8d8860488d20b6c030417c0c3ea7fba53a67f2c9f7
      - name: objectstore-plugin
        ref: ghcr.io/agent-substrate/substrate/objectstore-plugin:v1.0.1@sha256:311cc9cfb9ee8c344f3ebc3e4d5cafb88468840023b62d1c47c6338ed32b0352
      - name: kubernetes-secrets
        ref: ghcr.io/agent-substrate/substrate/kubernetes-secrets:v1.0.1@sha256:46a2872c624c6e3af98984f1097d2205f012ea6c471516ac5189ceb3adef96e5
      - name: podcertcontroller
        ref: ghcr.io/agent-substrate/substrate/podcertcontroller:v1.0.1@sha256:46aa01a624053c23080da41ea37937afc5b544cecf77088ab2196b4ffb734b4f
      - name: ateworker-gvisor
        ref: ghcr.io/agent-substrate/substrate/ateworker-gvisor:v1.0.1@sha256:fd0c6a46d6c69d485856171e632906e774594bea9d00011a4d7038be3e084a2a
      - name: envoy-dataplane
        ref: ghcr.io/agent-substrate/substrate/envoy-dataplane:v1.0.1@sha256:6f59332e4e45da4b1600cf1f0c2104c595d875b661be86b4b8c5b16603ad8191
      - name: postgres
        ref: docker.io/library/postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
      - name: envoy
        ref: docker.io/envoyproxy/envoy:v1.39.5@sha256:8fc594a5d85eb76dca24155cfb9208882406873932b20cf33649a0a611194c43
    note: >-
      Upstream Substrate v1.0.1 (20778a6db), installed with its own
      ate-setup from the same tag, its images straight from upstream's
      registry by digest (ateworker-microvm is published too; the
      substrate profile runs gVisor only). postgres and envoy are the
      third-party images its manifests pin. v1.0.1 hardens atenet-egress
      against loopback/link-local/metadata SSRF (#3881), upgrades Go to
      1.27.4 (GO-2026-6859) and klauspost/compress to v1.20.4
      (GO-2026-6865), returns a retryable 503 on slow actor resumes
      instead of an empty 504 (#3361), and caches Secrets in the k8s
      credential provider for --secret-cache-ttl (default 10s, #3635).
      No fork: the two settings the substrate profile still needs on top
      (atelet pinned to worker nodes, the router's parked-request budget)
      are patches `shipmind up` applies after the install, and `status`
      checks.

  - name: ax
    source: github.com/mastersingh24/ax
    version: db1c1def07ec0c76262c9102a558e43ffe19da5b
    profiles: [substrate]
    images:
      - name: ax-server
        ref: ghcr.io/go-steer/shipmind/ax-server:db1c1def07ec0c76262c9102a558e43ffe19da5b@sha256:1a8af6e9d96172632e1751c51c8a21dfaae5d0456b39f9a679d1f613f7b4b971
      - name: postgres
        ref: docker.io/library/postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    manifests:
      - deploy/ax-server.yaml
      - deploy/postgres.yaml
    note: >-
      ax-server, tag substrate-v1-drain-db1c1de (main). Fork of
      google/ax: upstream main 241bc4d with go.ate.dev/substrate v1.0.0,
      plus the fork's own task fields (egress, HTTP pass-through, idle
      suspend, on completion; proto numbers 100 and up, ax.proto unchanged
      since 12dbe16), a stable Ready updateTime (google/ax#539), the
      runner's pass-through sending Host 127.0.0.1:<port> with the
      router's name in X-Forwarded-Host, worker-drain suspend on node drain
      (mastersingh24/ax#1), and plain-HTTP egress rules for hosts prefixed
      with http:// (so an ax task can reach in-cluster HTTP gateways like
      switchboard's outbound ingress through Substrate's egress proxy with
      header injection while keeping ax.proto wire-compatible with lookout).
      State in Postgres; its password is a Secret `shipmind up` generates.
      google/ax does not take PRs, so the fork is the source.

  - name: ax-runner
    source: github.com/mastersingh24/ax
    version: db1c1def07ec0c76262c9102a558e43ffe19da5b
    profiles: [substrate]
    note: >-
      The task runner baked into the agent image, at ax's commit. The v1
      port's runner reads one workspace (AX_WORKSPACE_YAML), so it rolls
      with ax-server: an older runner finds no workspace. At 7c50347 its
      pass-through sends the task Host 127.0.0.1:<port> (the router's name
      in X-Forwarded-Host), and the workspace's first-run marker lives on
      the workspace volume (upstream #551), so a cold resume doesn't redo
      setup over the agent's edits. At d03b3e0 (mastersingh24/ax#1) a first
      SIGTERM keeps the agent running for AX_RUNNER_SIGTERM_GRACE (25m), so
      ax-server's suspend on drain snapshots a live process.

  - name: core-agent
    source: github.com/go-steer/core-agent
    version: 1b15d2371a382a64e2e0962c94a83f968633ce97
    profiles: [substrate]
    note: >-
      main (v3.3.0-dev at 1b15d237, post-v3.2.0), pinned by commit because
      images/agent builds it from source and checks what it fetched. Adds
      model.thinking_level and core-models v0.16.0 (core-agent#1605), omits
      MCP elicitation capability in headless/non-TUI runs (#1606), skips
      digest wrapping on subagents lacking retrieve_raw (#1604), keeps
      router-facing subagent descriptions out of child ADK identity prompts
      (#1607), and gates the Gemini parallelism quirk on each agent's
      enabled tool surface (#1608). Carries all v3.2.0 changes: pure-Go
      vcs_* tools over core-vcs v1.2.0 (with shared bare object caches under
      <workspace_dir>/.cache, #1490, #1581), builtin:propose-change,
      deferred VCSEventSink audit writes (#1571), lexical + symlink
      containment on open-prefix permission rules (#1579), Go 1.26.11 for
      GO-2026-6859 (#1549), per-specialist content roots (#1498),
      agent.max_steps (#1500), loopback attach Host guard (#1358), and
      attach-token session serving (#1483, #1485).

  - name: agent
    source: github.com/go-steer/shipmind
    version: 769a4f79e88008c9c0acb336c74da88c287bbd22
    profiles: [substrate]
    images:
      - name: agent
        ref: ghcr.io/go-steer/shipmind/agent:769a4f79e88008c9c0acb336c74da88c287bbd22@sha256:ec2c35b259898b52e17bf457d33c201f12b985266079e4929bf42f7a58c774fa
    note: >-
      The agent image on core-agent (#48), built by this repository
      (images/agent) at the commit in version: the core-agent, ax-runner,
      k8s-lookout and leeway pins plus agents/sre-triage's bundles
      (gke-triage-f and gke-chat), converted at build time on
      distroless/static-debian12:nonroot (#127). An environment's
      agent.chatImage runs switchboard's threads on it, and
      agent.incidentImage lookout's incidents. CI publishes a new build from
      every main commit that touches those inputs; move this pin to one
      deliberately.

  - name: k8s-lookout
    source: github.com/go-steer/k8s-lookout
    version: v0.46.0
    profiles: [substrate]
    images:
      - name: lookout
        ref: ghcr.io/go-steer/lookout:v0.46.0-gke@sha256:d16db0ce086adfdff82d7a99879c9c2965f04cb5c921ac7e3d1990116a9c6d9c
    manifests:
      - deploy/12-clusterrole-watcher.yaml
      - deploy/14-role-watcher-capacity.yaml
    note: >-
      Runs with the ax sink, opening one ax task per incident, and built
      into images/agent (-tags allproviders) so gke-chat serves lookout mcp
      --tools=k8s_audit_all (#127, #144). Only the watcher ClusterRole and
      kube-system capacity Role are vendored; the substrate profile's
      deployment is shaped for the ax sink (deploy/profiles/substrate/lookout).
      v0.43 speaks the ax fork's v1 port (12dbe16) and reaches Substrate's
      router over mTLS; it rolls with ax-server. v0.43.1 stops re-opening
      a resolved incident when a relist re-delivers its unchanged Event
      (shipmind#60). v0.44.0 negotiates Protobuf by default on typed
      Kubernetes clients (k8s-lookout#824), paginates, trims, and streams
      high-cardinality pod/event lists and copy-on-write graph edges for
      200k-pod watch/read scale (#825, #830, #831), includes steward
      v0.4.0 (#819), and builds on Go 1.26.11 for GO-2026-6859 (#826).
      v0.45.0 removes the in-tree leeway sources, flags, CRDs and signal
      kinds (#842; the vendored ClusterRole loses its LeewayPolicy rule),
      gates FailedScheduling on autoscaler verdicts and a count/span
      debounce (5 events over 2m, or up to 15m after a triggered scale-up;
      on by default with the capacity source, which this profile enables)
      (#835), reads
      events.k8s.io/v1 Series counts (#833), runs audit computeclass and
      audit ai inside audit all (#845), and gives lookout mcp injected
      Google auth, CREDENTIAL_PROXY_URL routing, GKE cluster paths and
      offline tools/list (#858), so an agent task can run it without a
      wrapper. v0.46.0 improves lookout mcp ergonomics (#867): MCP-worded
      errors/descriptions, default all_namespaces: true on namespace-scoped
      audit tools, inapplicable scope properties stripped from schemas,
      unconfigured server-flag tools hidden, single-caller stdio per-cluster
      queueing, severity-sorted response truncation before 100 KB cap, and
      structured elicit=cluster access logging. Upstream deprecates the root
      deploy/*.yaml paths vendored here in favour of deploy/base/ (#852);
      they are still shipped.

  - name: leeway
    source: github.com/go-steer/leeway
    version: v0.1.9
    profiles: [substrate]
    images:
      - name: leeway
        ref: ghcr.io/go-steer/leeway:v0.1.9@sha256:d1dbbcb72e751d6556ded1541bd8ac37087e33aeb0ef357bbb43eee561f5f1d0
    note: >-
      v0.1.9 (4e0a87effbc4a413f82a9f94785c5c40a9d61cd5): runtime placement
      skew and ComputeClass priority-rank posture (leeway report,
      leeway.report/v1alpha1), with deterministic Finding.Remediation YAML
      and addon-reconciled platform_managed guards (shipmind#127,
      shipmind#134). v0.1.8 adds leeway mcp (a stdio MCP server with one
      read-only report tool), injected Google auth and a client-go
      CREDENTIAL_PROXY_URL path (#37), so an agent task can run it
      without a wrapper. v0.1.9 adds async notifications/cancelled handling,
      a whole-call --timeout deadline across discovery and collection, an
      ambient multi-cluster sweep guard when clusters/clusters_from are
      omitted, array clusters acceptance, and nearest-field unknown-key
      hints (#41), plus conflicting-affinity context in platform_managed
      summaries and ShellMode kubeconfig discovery fixes (#27). Built from
      source into images/agent alongside lookout, where gke-chat runs leeway
      mcp; nothing in the substrate profile renders the published image yet.
      No LeewayPolicy or ClusterLeewayPolicy CRDs are vendored or installed
      on target clusters.

  - name: substrate-scope
    source: github.com/go-steer/substrate-scope
    version: d52a8aab965cc5c4cf0d5e5e6e8e6480447e560a
    profiles: [substrate]
    images:
      - name: substrate-scope
        ref: ghcr.io/go-steer/shipmind/substrate-scope:d52a8aab965cc5c4cf0d5e5e6e8e6480447e560a@sha256:751ca05d32a86f6cd8a785d78ae39c2ef2a697752903a4f25f6bec177d60552e
    manifests:
      - deploy/namespace.yaml
      - deploy/substrate-scope.yaml

  - name: token-refresher
    source: github.com/go-steer/shipmind
    version: 6193d32b7b43b23c9dbb6f396632b832c15d51ee
    profiles: [substrate]
    images:
      - name: token-refresher
        ref: ghcr.io/go-steer/shipmind/token-refresher:6193d32b7b43b23c9dbb6f396632b832c15d51ee@sha256:9a61d5d5306a6c1bf83ed81b9abe975aec637ee94013b0ee6fae222e26240017
    note: >-
      Built by this repository (images/token-refresher) at the commit in
      version. CI publishes a build from every main commit that touches
      it; move this pin deliberately.

  - name: e2e-runner
    source: github.com/go-steer/shipmind
    version: 769a4f79e88008c9c0acb336c74da88c287bbd22
    profiles: [substrate]
    images:
      - name: e2e-runner
        ref: ghcr.io/go-steer/shipmind/e2e-runner:769a4f79e88008c9c0acb336c74da88c287bbd22@sha256:783ce1da4c767dbe6bbc88fde508b502920ab2f98cad7fc36a277637d83c88aa
    note: >-
      The end-to-end runner (images/e2e-runner: shipmind, the ax CLI,
      kubectl, the scenarios) at the commit in version, which the nightly
      in deploy/e2e/substrate runs. CI publishes a build from every main
      commit that touches its inputs; move this pin deliberately. This
      build reads core-agent's sessions as well as mast's (#68) and
      records each answer's model usage (#73); it carries the
      oom-killed scenario (#79), can archive each run (#86), checks
      each run's trajectory (#94), has a judge model grade each answer
      (#99), and carries the worker-drain scenario (#106), which drains a
      shared worker and checks its other tasks (#109), counting any of ax's
      reverts as a failure (#112).

  - name: switchboard
    source: github.com/go-steer/switchboard
    version: v0.11.0
    profiles: [standalone, substrate]
    images:
      - name: switchboard
        ref: ghcr.io/go-steer/switchboard:0.11.0@sha256:7208f02d1810d2cec05456a0a72779db36c18e913ec8e0d2ebc2e1d592e3c2bc
    manifests:
      - deploy/base/11-serviceaccount.yaml
      - deploy/base/16-networkpolicy.yaml
      - deploy/base/51-deployment.yaml
      - deploy/components/durable-state/pvc.yaml
    files:
      - deploy/slack/app-manifest.yaml
    note: >-
      The chat gateway. v0.9.0 started agents as ax tasks; v0.9.1 stopped
      asserting the chat user to them by default, and v0.9.2 to mast
      daemons too (mast's attach surface refuses X-Asserted-Caller;
      per-agent `assert_caller`, for core-agent, shipmind#48). v0.10.0 seeds
      the first inbound reply in an unbound outbound-ingress thread with the
      remembered posts, PATCH edits, and continuation rollovers in that
      thread (switchboard#194) so a reply on an autonomous incident alert
      carries the diagnosis without chat-history scopes, and builds on Go
      1.26.11 for GO-2026-6859. v0.11.0 streams subagent inner-tool progress
      (`_fallback`, `propose-change`, awaited `spawn_agent`) in `status` and
      `stream` modes across Slack and Google Chat (switchboard#193) and
      surfaces tool activity on agent frames carrying both narration text and
      `functionCall` parts (switchboard#197). It starts agents as ax tasks
      (switchboard docs/ax-backend.md): one per Slack thread, reached through
      Substrate's router over mTLS. deploy/switchboard/slack runs its Slack
      gateway in front of the SRE triage agent; an environment opts in by
      referencing it. Vendored: the base and the durable-state PVC (the
      durable-state and ax-router-mtls patches are in that part, since a
      vendored base can't carry a component). Also the Slack app manifest,
      which `shipmind slack-app` renames per environment: its scopes follow
      the API calls this version makes, so a bump re-vendors them.